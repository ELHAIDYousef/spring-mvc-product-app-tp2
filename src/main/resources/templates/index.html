<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="layout">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>

<div class="container p-3" layout:fragment="content">


    <div class="d-flex justify-content-between mb-3" sec:authorize="hasRole('ADMIN')" >

        <!-- Add Product Button -->
        <a class="btn btn-primary"
           th:href="@{/formProducts}">
            + Add Product
        </a>

        <!-- Search Form -->
        <form class="d-flex" th:action="@{/}" method="get">
            <input class="form-control me-2"
                   type="search"
                   name="keyword"
                   placeholder="Search product"
                   th:value="${keyword}">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>

    </div>
    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.quantity}"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-warning btn-sm"
                   th:href="@{/edit(id=${product.id})}">
                    Edit
                </a>
                <a class="btn btn-danger btn-sm"
                   th:href="@{/delete(id=${product.id})}"
                   onclick="return confirm('Are you sure you want to delete this product?')">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>


    </table>
    <div class="d-flex justify-content-center mt-3">
        <ul class="pagination">

            <!-- Previous -->
            <li class="page-item" th:classappend="${currentPage==0}?'disabled'">
                <a class="page-link"
                   th:href="@{/(page=${currentPage-1}, keyword=${keyword})}">
                    Previous
                </a>
            </li>

            <!-- Pages -->
            <li th:each="page,status : ${pages}"
                th:class="${status.index==currentPage}?'page-item active':'page-item'">

                <a class="page-link"
                   th:href="@{/(page=${status.index}, keyword=${keyword})}"
                   th:text="${status.index+1}">
                </a>

            </li>

            <!-- Next -->
            <li class="page-item"
                th:classappend="${currentPage==pages.length-1}?'disabled'">

                <a class="page-link"
                   th:href="@{/(page=${currentPage+1}, keyword=${keyword})}">
                    Next
                </a>
            </li>

        </ul>
    </div>
</div>
</body>
</html>
